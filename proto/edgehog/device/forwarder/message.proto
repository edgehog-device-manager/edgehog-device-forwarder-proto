syntax = "proto3";

package edgehog.device.forwarder;

import "edgehog/device/forwarder/http.proto";
import "edgehog/device/forwarder/https.proto";
import "edgehog/device/forwarder/ws.proto";

message Message {
  oneof protocol {
    Http http = 1;
    WebSocket ws = 2;
    Https https = 3;
  }
}
